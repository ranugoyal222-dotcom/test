services:
  db:
    image: postgres:17-alpine
    container_name: social-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social
    ports:
      - "5434:5432"
    volumes:
      - social_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: social-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/social
      SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 10
      CORS_ORIGINS: http://localhost:3100
    ports:
      - "8200:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8200
    container_name: social-frontend
    ports:
      - "3100:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  social_pgdata:
